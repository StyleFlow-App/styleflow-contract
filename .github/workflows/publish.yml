name: Publish Styleflow contract

on:
  push:
    tags:
      - "contract-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify tag and publish package
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/contract/package.json').version")"
          test "${GITHUB_REF_NAME}" = "contract-v${package_version}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          cd packages/contract
          if [[ "${package_version}" == *-* ]]; then
            npm publish --access public --tag next --provenance
          else
            npm publish --access public --tag latest --provenance
          fi
