name: Bootstrap Styleflow contract package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable contract release tag to publish
        required: true
        default: contract-v1.0.0-beta.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify immutable tag and bootstrap package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN}"
          package_version="$(node -p "require('./packages/contract/package.json').version")"
          test "${{ inputs.tag }}" = "contract-v${package_version}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${{ inputs.tag }}")"
          pnpm --filter @styleflow.app/contract publish \
            --access public \
            --tag next \
            --provenance \
            --no-git-checks
