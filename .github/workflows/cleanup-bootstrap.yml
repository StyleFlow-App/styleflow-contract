name: Cleanup contract bootstrap dist-tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Remove automatic latest dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN}"
          test "$(npm view @styleflow.app/contract@next version)" = "1.0.0-beta.0"
          npm dist-tag rm @styleflow.app/contract latest
